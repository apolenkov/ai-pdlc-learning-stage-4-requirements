schema: spec-driven
context: |
  Синтетический учебный продукт. В personal import-base этот репозиторий
  является единственным активным владельцем всего planning inventory из
  docs/course/planning-provenance.json. Planning source и отдельный service pin
  используются только как read-only контекст. Итог R4 — согласованный Change
  limit-credit-amount без Apply и без изменения кода сервиса.
rules:
  proposal:
    - Для limit-credit-amount перечислять зависимости от каждого применимого импортированного активного Change из planning-provenance.json и указывать provenance полного planning SHA.
    - Не предполагать фиксированное имя второго Change, число файлов, сценариев или строк traceability.
  specs:
    - Диапазон 10 000–100 000 000 рублей включителен; соседние целые значения 9 999 и 100 000 001 должны иметь ошибочные сценарии с очисткой всех применимых результатов.
    - Если существующий успешный пример конфликтует с новым минимумом, оформлять его замену новой MODIFIED delta только после явного решения пользователя; импортированные файлы не редактировать.
    - Не выдумывать результаты или capabilities, отсутствующие в фактически импортированных specs и Changes.
  tasks:
    - Каждому не реализованному требованию сопоставлять отдельную задачу с проверкой и оставлять её незавершённой до отдельного Apply.
