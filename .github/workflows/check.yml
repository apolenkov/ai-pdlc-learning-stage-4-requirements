name: check

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        required: true
        default: ubuntu-latest
        type: choice
        options:
          - ubuntu-latest
          - dtl-arc
          - dtl-arc-4c8r

jobs:
  check:
    runs-on: ${{ inputs.runner || 'course-meta' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
